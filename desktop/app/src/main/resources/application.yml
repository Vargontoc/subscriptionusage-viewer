spring:
  main:
    web-application-type: none
    banner-mode: off

# Valores por defecto documentados de la aplicación.
# Pueden sobrescribirse con un fichero externo (por ejemplo,
# application.yml junto al JAR o --spring.config.location).
app:
  name: "Subscription Usage Viewer"
  tray-icon-path: "icons/app-icon.png"
  usage-state-file: "~/.claude/statusline-dump.json"
  usage-poll-interval: "10s"

# Valores por defecto de la consulta de uso de OpenCode Go.
subscription-viewer:
  opencode:
    usage-url: "https://opencode.ai/zen/go/v1/usage"
    usage-poll-interval: "60s"
    backoff-max-interval: "300s"

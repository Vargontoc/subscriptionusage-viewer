spring:
  config:
    import: optional:file:.env[.properties]
  main:
    web-application-type: none
    banner-mode: off

# Valores por defecto documentados de la aplicación.
# Pueden sobrescribirse con un fichero externo (por ejemplo,
# application.yml junto al JAR o --spring.config.location).
app:
  name: "Subscription Usage Viewer"
  tray-icon-path: "icons/app-icon.png"

# Valores por defecto de la consulta de uso de OpenCode Go.
# La tabla usa una lista para que los puntos de los ids de modelo no se
# interpreten como separadores de propiedades. Para añadir o cambiar un
# modelo, edita una sola línea (modelo y tope mensual en dólares).
subscription-viewer:
  claude:
    usage-state-file: "~/.claude/statusline-dump.json"
    usage-poll-interval: "10s"
  openai:
    usage-poll-interval: "60s"
  opencode:
    cycle-day: 4
    default-cap-usd: 60
    poll-interval-seconds: 60
    command-timeout-seconds: 30
    model-caps:
      - model: "qwen3.7-plus"
        cap-usd: 60
      - model: "kimi-k2.7-code"
        cap-usd: 60
      - model: "minimax-m3"
        cap-usd: 60
      - model: "gemini-4-argon-contributor"
        cap-usd: 60
      - model: "glm-5.3-flash"
      
